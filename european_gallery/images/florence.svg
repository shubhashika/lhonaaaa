<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="sky2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFB347;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFC46B;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Sky -->
  <rect width="800" height="600" fill="url(#sky2)"/>
  
  <!-- Dome Base -->
  <ellipse cx="400" cy="350" rx="80" ry="30" fill="#C4A57B"/>
  
  <!-- Cathedral Dome (Red Terracotta) -->
  <path d="M 320 350 Q 320 250 400 180 Q 480 250 480 350" fill="#CD5C5C" stroke="#8B3A3A" stroke-width="3"/>
  
  <!-- Dome segments -->
  <line x1="340" y1="320" x2="340" y2="200" stroke="#8B3A3A" stroke-width="2"/>
  <line x1="360" y1="290" x2="360" y2="170" stroke="#8B3A3A" stroke-width="2"/>
  <line x1="400" y1="280" x2="400" y2="140" stroke="#8B3A3A" stroke-width="2"/>
  <line x1="440" y1="290" x2="440" y2="170" stroke="#8B3A3A" stroke-width="2"/>
  <line x1="460" y1="320" x2="460" y2="200" stroke="#8B3A3A" stroke-width="2"/>
  
  <!-- Lantern on top -->
  <rect x="385" y="150" width="30" height="50" fill="#D4A574"/>
  <circle cx="400" cy="155" r="15" fill="#FFD700"/>
  
  <!-- Cathedral body -->
  <rect x="300" y="350" width="200" height="150" fill="#E8CBA5" stroke="#8B7355" stroke-width="2"/>
  
  <!-- Cathedral details -->
  <rect x="320" y="370" width="40" height="80" fill="#D4AF99"/>
  <rect x="370" y="370" width="40" height="80" fill="#D4AF99"/>
  <rect x="420" y="370" width="40" height="80" fill="#D4AF99"/>
  
  <!-- Windows -->
  <circle cx="330" cy="390" r="10" fill="#87CEEB"/>
  <circle cx="380" cy="390" r="10" fill="#87CEEB"/>
  <circle cx="430" cy="390" r="10" fill="#87CEEB"/>
  
  <!-- Left building -->
  <rect x="80" y="380" width="120" height="170" fill="#D4A574"/>
  <rect x="90" y="395" width="20" height="25" fill="#87CEEB"/>
  <rect x="125" y="395" width="20" height="25" fill="#87CEEB"/>
  <rect x="160" y="395" width="20" height="25" fill="#87CEEB"/>
  <rect x="90" y="445" width="20" height="25" fill="#87CEEB"/>
  <rect x="125" y="445" width="20" height="25" fill="#87CEEB"/>
  <rect x="160" y="445" width="20" height="25" fill="#87CEEB"/>
  
  <!-- Right building -->
  <rect x="600" y="380" width="120" height="170" fill="#E8CBA5"/>
  <rect x="620" y="395" width="20" height="25" fill="#87CEEB"/>
  <rect x="655" y="395" width="20" height="25" fill="#87CEEB"/>
  <rect x="690" y="395" width="20" height="25" fill="#87CEEB"/>
  <rect x="620" y="445" width="20" height="25" fill="#87CEEB"/>
  <rect x="655" y="445" width="20" height="25" fill="#87CEEB"/>
  <rect x="690" y="445" width="20" height="25" fill="#87CEEB"/>
  
  <!-- Foreground -->
  <rect y="550" width="800" height="50" fill="#8B7355" opacity="0.3"/>
  
  <!-- Sun -->
  <circle cx="700" cy="100" r="50" fill="#FFD700" opacity="0.7"/>
</svg>