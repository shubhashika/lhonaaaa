<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="alpineSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0F6FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lakeSea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E5C8A;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Sky -->
  <rect width="800" height="300" fill="url(#alpineSky)"/>
  
  <!-- Mountains -->
  <polygon points="0,300 200,100 400,150 600,80 800,200 800,300" fill="#6B4423"/>
  <polygon points="0,300 150,140 350,180 550,120 800,200 800,300" fill="#8B5A2B"/>
  <polygon points="50,300 250,180 450,220 700,160 800,250 800,300" fill="#A0522D"/>
  
  <!-- Snow caps -->
  <polygon points="200,100 180,120 220,120" fill="#FFFFFF"/>
  <polygon points="400,150 380,170 420,170" fill="#FFFFFF"/>
  <polygon points="600,80 575,110 625,110" fill="#FFFFFF"/>
  
  <!-- Lake -->
  <rect y="300" width="800" height="300" fill="url(#lakeSea)"/>
  
  <!-- Reflection of mountains -->
  <polygon points="0,300 200,450 400,400 600,480 800,350 800,300" fill="#2E5C8A" opacity="0.3"/>
  
  <!-- Village on shore -->
  <rect x="150" y="270" width="80" height="60" fill="#D4A574"/>
  <rect x="165" y="280" width="15" height="20" fill="#87CEEB"/>
  <rect x="195" y="280" width="15" height="20" fill="#87CEEB"/>
  <polygon points="190,270 180,250 200,270" fill="#CD5C5C"/>
  
  <!-- Right village -->
  <rect x="600" y="280" width="70" height="50" fill="#F5DEB3"/>
  <rect x="615" y="290" width="12" height="18" fill="#87CEEB"/>
  <rect x="640" y="290" width="12" height="18" fill="#87CEEB"/>
  <polygon points="630,280 623,265 637,280" fill="#8B4513"/>
  
  <!-- Boats -->
  <ellipse cx="300" cy="400" rx="35" ry="18" fill="#DC143C"/>
  <polygon points="300,400 310,380 290,380" fill="#FFD700"/>
  
  <ellipse cx="500" cy="420" rx="30" ry="15" fill="#1C1C1C"/>
  <polygon points="500,420 508,400 492,400" fill="#FFA500"/>
  
  <!-- Clouds -->
  <ellipse cx="100" cy="80" rx="50" ry="25" fill="#FFFFFF" opacity="0.7"/>
  <ellipse cx="700" cy="100" rx="45" ry="22" fill="#FFFFFF" opacity="0.6"/>
</svg>
