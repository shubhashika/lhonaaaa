<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="jungfrauSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0F6FF;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Sky -->
  <rect width="800" height="600" fill="url(#jungfrauSky)"/>
  
  <!-- Main peak - Jungfrau -->
  <polygon points="400,80 150,500 650,500" fill="#696969"/>
  <polygon points="400,80 180,480 620,480" fill="#808080"/>
  
  <!-- Snow-covered peak -->
  <polygon points="400,80 350,200 450,200" fill="#FFFFFF"/>
  <polygon points="400,80 370,150 430,150" fill="#FFFFFF"/>
  <polygon points="400,80 310,350 490,350" fill="#FFFFFF" opacity="0.8"/>
  
  <!-- Side peaks -->
  <polygon points="200,480 80,300 320,480" fill="#6B4423"/>
  <polygon points="600,480 680,320 800,480" fill="#6B4423"/>
  
  <!-- Snow on side peaks -->
  <polygon points="200,300 160,380 240,380" fill="#FFFFFF" opacity="0.7"/>
  <polygon points="680,320 640,400 720,400" fill="#FFFFFF" opacity="0.7"/>
  
  <!-- Glaciers (suggested by white areas) -->
  <polygon points="330,320 300,420 360,420" fill="#E6F7FF" opacity="0.6"/>
  <polygon points="470,340 440,420 500,420" fill="#E6F7FF" opacity="0.6"/>
  
  <!-- Alpine meadow -->
  <rect y="480" width="800" height="120" fill="#2E8B57" opacity="0.3"/>
  
  <!-- Train station (suggested) -->
  <rect x="350" y="450" width="100" height="30" fill="#696969" opacity="0.5"/>
  
  <!-- Clouds -->
  <ellipse cx="150" cy="150" rx="60" ry="35" fill="#FFFFFF" opacity="0.5"/>
  <ellipse cx="700" cy="180" rx="55" ry="30" fill="#FFFFFF" opacity="0.5"/>
</svg>
