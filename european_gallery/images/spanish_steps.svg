<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="stepsSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#B0C4DE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E6E6FA;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Sky -->
  <rect width="800" height="600" fill="url(#stepsSky)"/>
  
  <!-- Grand staircase - multiple steps -->
  <rect x="150" y="500" width="500" height="12" fill="#C9B0A3"/>
  <rect x="160" y="485" width="480" height="12" fill="#D4A574"/>
  <rect x="170" y="470" width="460" height="12" fill="#C9B0A3"/>
  <rect x="180" y="455" width="440" height="12" fill="#D4A574"/>
  <rect x="190" y="440" width="420" height="12" fill="#C9B0A3"/>
  <rect x="200" y="425" width="400" height="12" fill="#D4A574"/>
  <rect x="210" y="410" width="380" height="12" fill="#C9B0A3"/>
  <rect x="220" y="395" width="360" height="12" fill="#D4A574"/>
  <rect x="230" y="380" width="340" height="12" fill="#C9B0A3"/>
  <rect x="240" y="365" width="320" height="12" fill="#D4A574"/>
  <rect x="250" y="350" width="300" height="12" fill="#C9B0A3"/>
  
  <!-- Church at top -->
  <rect x="280" y="250" width="240" height="110" fill="#F5DEB3"/>
  <polygon points="320,250 400,180 480,250" fill="#8B4513"/>
  
  <!-- Church entrance -->
  <rect x="370" y="310" width="60" height="50" fill="#696969"/>
  
  <!-- Church details -->
  <circle cx="340" cy="220" r="10" fill="#87CEEB"/>
  <circle cx="380" cy="220" r="10" fill="#87CEEB"/>
  <circle cx="460" cy="220" r="10" fill="#87CEEB"/>
  
  <!-- Side buildings -->
  <rect x="100" y="320" width="100" height="100" fill="#E8CBA5"/>
  <rect x="600" y="330" width="100" height="90" fill="#F5DEB3"/>
  
  <!-- Windows on side buildings -->
  <circle cx="125" cy="350" r="8" fill="#87CEEB"/>
  <circle cx="155" cy="350" r="8" fill="#87CEEB"/>
  <circle cx="620" cy="360" r="8" fill="#87CEEB"/>
  <circle cx="650" cy="360" r="8" fill="#87CEEB"/>
  
  <!-- People on steps (dots) -->
  <circle cx="300" cy="440" r="4" fill="#DC143C"/>
  <circle cx="350" cy="420" r="4" fill="#1C1C1C"/>
  <circle cx="400" cy="400" r="4" fill="#DC143C"/>
  <circle cx="320" cy="380" r="4" fill="#1C1C1C"/>
  <circle cx="420" cy="370" r="4" fill="#DC143C"/>
  
  <!-- Obelisk at top -->
  <polygon points="400,150 395,180 405,180" fill="#696969"/>
  <circle cx="400" cy="145" r="6" fill="#FFD700"/>
  
  <!-- Sun -->
  <circle cx="680" cy="90" r="40" fill="#FFD700" opacity="0.7"/>
</svg>
