<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="urbanSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#B0C4DE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E6E6FA;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Sky -->
  <rect width="800" height="600" fill="url(#urbanSky)"/>
  
  <!-- Main Cathedral (Duomo) -->
  <rect x="320" y="200" width="160" height="300" fill="#E8D8C8"/>
  
  <!-- Spires -->
  <polygon points="340,200 330,100 350,200" fill="#C0A080"/>
  <polygon points="380,200 370,80 390,200" fill="#C0A080"/>
  <polygon points="420,200 410,70 430,200" fill="#C0A080"/>
  <polygon points="460,200 450,80 470,200" fill="#C0A080"/>
  <polygon points="460,200 450,80 470,200" fill="#C0A080"/>
  
  <!-- Cathedral Gothic details -->
  <rect x="330" y="220" width="25" height="80" fill="#D4A574"/>
  <rect x="365" y="220" width="25" height="80" fill="#D4A574"/>
  <rect x="400" y="220" width="25" height="80" fill="#D4A574"/>
  <rect x="435" y="220" width="25" height="80" fill="#D4A574"/>
  
  <!-- Windows -->
  <polygon points="340,250 345,240 350,250 345,255" fill="#87CEEB"/>
  <polygon points="375,250 380,240 385,250 380,255" fill="#87CEEB"/>
  <polygon points="410,250 415,240 420,250 415,255" fill="#87CEEB"/>
  <polygon points="445,250 450,240 455,250 450,255" fill="#87CEEB"/>
  
