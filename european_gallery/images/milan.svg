  <rect x="100" y="350" width="140" height="200" fill="#A9A9A9"/>
  <rect x="120" y="370" width="20" height="30" fill="#87CEEB"/>
  <rect x="155" y="370" width="20" height="30" fill="#87CEEB"/>
  <rect x="120" y="420" width="20" height="30" fill="#87CEEB"/>
  <rect x="155" y="420" width="20" height="30" fill="#87CEEB"/>
  
  <!-- Right building -->
  <rect x="560" y="320" width="140" height="230" fill="#C0C0C0"/>
  <rect x="580" y="345" width="20" height="35" fill="#87CEEB"/>
  <rect x="615" y="345" width="20" height="35" fill="#87CEEB"/>
  <rect x="580" y="405" width="20" height="35" fill="#87CEEB"/>
  <rect x="615" y="405" width="20" height="35" fill="#87CEEB"/>
  
  <!-- Street/Ground -->
  <rect y="550" width="800" height="50" fill="#696969"/>
  
  <!-- People silhouettes -->
  <circle cx="250" cy="535" r="5" fill="#1C1C1C"/>
  <rect x="245" y="540" width="10" height="15" fill="#1C1C1C"/>
  
  <circle cx="500" cy="535" r="5" fill="#1C1C1C"/>
  <rect x="495" y="540" width="10" height="15" fill="#1C1C1C"/>
