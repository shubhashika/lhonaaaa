<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="valleySky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFE4C4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="riverWater" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E5C8A;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Sky -->
  <rect width="800" height="400" fill="url(#valleySky)"/>
  
  <!-- River -->
  <ellipse cx="400" cy="480" rx="300" ry="80" fill="url(#riverWater)"/>
  
  <!-- Château -->
  <rect x="250" y="240" width="300" height="150" fill="#D4A574"/>
  <polygon points="220,240 250,150 280,240" fill="#8B4513"/>
  <polygon points="520,240 550,140 580,240" fill="#8B4513"/>
  <polygon points="370,240 400,160 430,240" fill="#8B4513"/>
  
  <!-- Windows -->
  <circle cx="280" cy="280" r="10" fill="#87CEEB"/>
  <circle cx="330" cy="280" r="10" fill="#87CEEB"/>
  <circle cx="380" cy="280" r="10" fill="#87CEEB"/>
  <circle cx="430" cy="280" r="10" fill="#87CEEB"/>
  <circle cx="480" cy="280" r="10" fill="#87CEEB"/>
  <circle cx="530" cy="280" r="10" fill="#87CEEB"/>
  
  <circle cx="280" cy="340" r="10" fill="#87CEEB"/>
  <circle cx="330" cy="340" r="10" fill="#87CEEB"/>
  <circle cx="380" cy="340" r="10" fill="#87CEEB"/>
  <circle cx="430" cy="340" r="10" fill="#87CEEB"/>
  <circle cx="480" cy="340" r="10" fill="#87CEEB"/>
  <circle cx="530" cy="340" r="10" fill="#87CEEB"/>
  
  <!-- Gardens -->
  <ellipse cx="150" cy="400" rx="100" ry="60" fill="#2E8B57"/>
  <ellipse cx="650" cy="420" rx="110" ry="65" fill="#2E8B57"/>
  
  <!-- Fountain -->
  <circle cx="400" cy="380" r="20" fill="#87CEEB"/>
  <circle cx="400" cy="380" r="12" fill="#FFFFFF" opacity="0.6"/>
  
  <!-- Foreground -->
  <rect y="560" width="800" height="40" fill="#8B7355" opacity="0.3"/>
  
  <!-- Sun -->
  <circle cx="680" cy="80" r="40" fill="#FFD700" opacity="0.8"/>
  
  <!-- Clouds -->
  <ellipse cx="150" cy="100" rx="50" ry="25" fill="#FFFFFF" opacity="0.6"/>
  <ellipse cx="200" cy="90" rx="40" ry="20" fill="#FFFFFF" opacity="0.6"/>
</svg>
