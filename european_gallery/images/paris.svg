<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="parisSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#B0C4DE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E6E6FA;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Sky -->
  <rect width="800" height="600" fill="url(#parisSky)"/>
  
  <!-- Eiffel Tower Base -->
  <rect x="350" y="400" width="100" height="150" fill="#C0C0C0"/>
  <polygon points="380,400 320,380 380,350" fill="#A9A9A9"/>
  <polygon points="420,400 480,380 420,350" fill="#A9A9A9"/>
  
  <!-- Eiffel Tower Left Leg -->
  <line x1="360" y1="380" x2="280" y2="250" stroke="#696969" stroke-width="8"/>
  <line x1="370" y1="380" x2="300" y2="250" stroke="#696969" stroke-width="6"/>
  
  <!-- Eiffel Tower Right Leg -->
  <line x1="440" y1="380" x2="520" y2="250" stroke="#696969" stroke-width="8"/>
  <line x1="430" y1="380" x2="500" y2="250" stroke="#696969" stroke-width="6"/>
  
  <!-- Eiffel Tower Center -->
  <line x1="400" y1="350" x2="400" y2="100" stroke="#696969" stroke-width="6"/>
  
  <!-- First platform -->
  <ellipse cx="400" cy="280" rx="60" ry="15" fill="#808080" opacity="0.7"/>
  
  <!-- Second platform -->
  <ellipse cx="400" cy="190" rx="45" ry="12" fill="#808080" opacity="0.7"/>
  
  <!-- Top point -->
  <polygon points="400,80 395,100 405,100" fill="#FFD700"/>
  
  <!-- Buildings around -->
  <rect x="80" y="350" width="120" height="150" fill="#D4A574"/>
  <rect x="100" y="370" width="20" height="30" fill="#87CEEB"/>
  <rect x="135" y="370" width="20" height="30" fill="#87CEEB"/>
  <rect x="170" y="370" width="20" height="30" fill="#87CEEB"/>
  
  <rect x="650" y="360" width="120" height="140" fill="#E8CBA5"/>
  <rect x="670" y="380" width="20" height="30" fill="#87CEEB"/>
  <rect x="705" y="380" width="20" height="30" fill="#87CEEB"/>
  
  <!-- Street -->
  <rect y="500" width="800" height="100" fill="#A9A9A9" opacity="0.5"/>
  
  <!-- Clouds -->
  <ellipse cx="150" cy="120" rx="50" ry="25" fill="#FFFFFF" opacity="0.7"/>
  <ellipse cx="700" cy="130" rx="45" ry="22" fill="#FFFFFF" opacity="0.6"/>
</svg>
