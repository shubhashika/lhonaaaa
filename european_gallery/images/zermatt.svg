<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="alpineSky2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0F6FF;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Sky -->
  <rect width="800" height="600" fill="url(#alpineSky2)"/>
  
  <!-- Matterhorn mountain -->
  <polygon points="400,100 200,500 600,500" fill="#696969"/>
  <polygon points="400,100 220,480 580,480" fill="#808080"/>
  
  <!-- Snow on peak -->
  <polygon points="400,100 350,250 450,250" fill="#FFFFFF"/>
  <polygon points="400,100 370,200 430,200" fill="#FFFFFF"/>
  
  <!-- Snow line -->
  <line x1="200" y1="450" x2="600" y2="450" stroke="#FFFFFF" stroke-width="4" opacity="0.7"/>
  
  <!-- Village buildings -->
  <rect x="250" y="420" width="50" height="50" fill="#D4A574"/>
  <rect x="340" y="430" width="55" height="45" fill="#E8CBA5"/>
  <rect x="440" y="425" width="50" height="50" fill="#F5DEB3"/>
  
  <!-- Chalets with roofs -->
  <polygon points="265,420 250,405 280,420" fill="#8B4513"/>
  <polygon points="357,430 340,415 375,430" fill="#A0522D"/>
  <polygon points="455,425 440,410 470,425" fill="#8B4513"/>
  
  <!-- Windows -->
  <circle cx="260" cy="440" r="5" fill="#87CEEB"/>
  <circle cx="275" cy="440" r="5" fill="#87CEEB"/>
  <circle cx="350" cy="450" r="5" fill="#87CEEB"/>
  <circle cx="365" cy="450" r="5" fill="#87CEEB"/>
  
  <!-- Pine trees -->
  <polygon points="150,380 140,420 160,420" fill="#2F4F4F"/>
  <polygon points="700,390 690,430 710,430" fill="#2F4F4F"/>
  <polygon points="200,400 185,440 215,440" fill="#1C3D1C"/>
  <polygon points="650,400 635,440 665,440" fill="#1C3D1C"/>
  
  <!-- Alpine meadow -->
  <rect y="480" width="800" height="120" fill="#2E8B57" opacity="0.3"/>
</svg>
