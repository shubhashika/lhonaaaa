<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="rivSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0F6FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="medSea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00BFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E90FF;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Sky -->
  <rect width="800" height="350" fill="url(#rivSky)"/>
  
  <!-- Sea -->
  <rect y="350" width="800" height="250" fill="url(#medSea)"/>
  
  <!-- Beach -->
  <ellipse cx="400" cy="420" rx="200" ry="50" fill="#FFD700"/>
  
  <!-- Palm trees -->
  <line x1="150" y1="350" x2="150" y2="450" stroke="#8B4513" stroke-width="8"/>
  <ellipse cx="130" cy="300" rx="30" ry="50" fill="#2E8B57"/>
  <ellipse cx="150" cy="270" rx="25" ry="45" fill="#2E8B57"/>
  <ellipse cx="170" cy="290" rx="28" ry="48" fill="#2E8B57"/>
  
  <line x1="650" y1="380" x2="650" y2="480" stroke="#8B4513" stroke-width="8"/>
  <ellipse cx="630" cy="330" rx="30" ry="50" fill="#2E8B57"/>
  <ellipse cx="650" cy="300" rx="25" ry="45" fill="#2E8B57"/>
  <ellipse cx="670" cy="320" rx="28" ry="48" fill="#2E8B57"/>
  
  <!-- Waterfront buildings -->
  <rect x="250" y="320" width="100" height="80" fill="#FFE4C4"/>
  <rect x="265" y="335" width="18" height="25" fill="#87CEEB"/>
  <rect x="305" y="335" width="18" height="25" fill="#87CEEB"/>
  <rect x="265" y="370" width="18" height="25" fill="#87CEEB"/>
  <rect x="305" y="370" width="18" height="25" fill="#87CEEB"/>
  
  <rect x="450" y="310" width="110" height="90" fill="#F5DEB3"/>
  <rect x="468" y="325" width="20" height="28" fill="#87CEEB"/>
  <rect x="512" y="325" width="20" height="28" fill="#87CEEB"/>
  <rect x="468" y="365" width="20" height="28" fill="#87CEEB"/>
  <rect x="512" y="365" width="20" height="28" fill="#87CEEB"/>
  
  <!-- Sailboats -->
  <ellipse cx="200" cy="480" rx="30" ry="15" fill="#DC143C"/>
  <polygon points="200,480 210,430 190,430" fill="#FFD700"/>
  
  <ellipse cx="550" cy="500" rx="28" ry="14" fill="#1C1C1C"/>
  <polygon points="550,500 560,445 540,445" fill="#FFA500"/>
  
  <!-- Sun -->
  <circle cx="100" cy="80" r="40" fill="#FFD700" opacity="0.8"/>
</svg>
