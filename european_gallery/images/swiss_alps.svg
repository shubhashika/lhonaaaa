<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="alpsSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0F6FF;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Sky -->
  <rect width="800" height="600" fill="url(#alpsSky)"/>
  
  <!-- Back mountain range -->
  <polygon points="0,400 100,250 250,350 400,200 550,300 700,180 800,400" fill="#5A4A3A" opacity="0.5"/>
  
  <!-- Main mountains -->
  <polygon points="100,400 200,150 300,400" fill="#6B4423"/>
  <polygon points="300,400 420,100 550,400" fill="#696969"/>
  <polygon points="500,400 650,120 800,400" fill="#6B4423"/>
  
  <!-- Snow caps -->
  <polygon points="200,150 170,250 230,250" fill="#FFFFFF"/>
  <polygon points="420,100 380,200 460,200" fill="#FFFFFF"/>
  <polygon points="650,120 615,220 685,220" fill="#FFFFFF"/>
  
  <!-- Glaciers -->
  <polygon points="250,250 240,350 260,350" fill="#E6F7FF" opacity="0.7"/>
  <polygon points="450,200 430,350 470,350" fill="#E6F7FF" opacity="0.7"/>
  <polygon points="600,220 580,350 620,350" fill="#E6F7FF" opacity="0.7"/>
  
  <!-- Alpine village -->
  <rect x="180" y="350" width="50" height="35" fill="#D4A574"/>
  <rect x="380" y="320" width="55" height="40" fill="#E8CBA5"/>
  <rect x="600" y="340" width="48" height="38" fill="#D4A574"/>
  
  <!-- Chalets with roofs -->
  <polygon points="195,350 180,335 210,350" fill="#8B4513"/>
  <polygon points="405,320 385,305 425,320" fill="#A0522D"/>
  <polygon points="615,340 600,325 630,340" fill="#8B4513"/>
  
  <!-- Alpine meadow -->
  <rect y="400" width="800" height="200" fill="#2E8B57" opacity="0.4"/>
  
  <!-- Wildflowers (dots) -->
  <circle cx="150" cy="420" r="3" fill="#FF69B4" opacity="0.7"/>
  <circle cx="200" cy="430" r="3" fill="#FFD700" opacity="0.7"/>
  <circle cx="400" cy="425" r="3" fill="#FF69B4" opacity="0.7"/>
  <circle cx="550" cy="435" r="3" fill="#FFD700" opacity="0.7"/>
  <circle cx="700" cy="420" r="3" fill="#FF69B4" opacity="0.7"/>
  
  <!-- Clouds -->
  <ellipse cx="100" cy="80" rx="60" ry="35" fill="#FFFFFF" opacity="0.6"/>
  <ellipse cx="700" cy="100" rx="55" ry="32" fill="#FFFFFF" opacity="0.5"/>
</svg>
