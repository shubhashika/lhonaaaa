<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="pantheonSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFE4C4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Sky -->
  <rect width="800" height="600" fill="url(#pantheonSky)"/>
  
  <!-- Dome structure -->
  <circle cx="400" cy="300" r="140" fill="#C0A080" stroke="#8B7355" stroke-width="3"/>
  <circle cx="400" cy="300" r="130" fill="#D4A574"/>
  
  <!-- Oculus (opening) at top -->
  <circle cx="400" cy="180" r="25" fill="#2E2E2E"/>
  <circle cx="400" cy="180" r="20" fill="#1C1C1C"/>
  
  <!-- Dome segments/pattern -->
  <line x1="400" y1="170" x2="400" y2="430" stroke="#8B7355" stroke-width="2" opacity="0.5"/>
  <line x1="330" y1="240" x2="470" y2="360" stroke="#8B7355" stroke-width="2" opacity="0.4"/>
  <line x1="470" y1="240" x2="330" y2="360" stroke="#8B7355" stroke-width="2" opacity="0.4"/>
  
  <!-- Front portico - columns -->
  <rect x="320" y="300" width="15" height="150" fill="#B8B8B8"/>
  <rect x="360" y="300" width="15" height="150" fill="#B8B8B8"/>
  <rect x="400" y="300" width="15" height="150" fill="#B8B8B8"/>
  <rect x="440" y="300" width="15" height="150" fill="#B8B8B8"/>
  <rect x="480" y="300" width="15" height="150" fill="#B8B8B8"/>
  
  <!-- Column capitals -->
  <ellipse cx="327" cy="300" rx="18" ry="6" fill="#A0826D"/>
  <ellipse cx="367" cy="300" rx="18" ry="6" fill="#A0826D"/>
  <ellipse cx="407" cy="300" rx="18" ry="6" fill="#A0826D"/>
  <ellipse cx="447" cy="300" rx="18" ry="6" fill="#A0826D"/>
  <ellipse cx="487" cy="300" rx="18" ry="6" fill="#A0826D"/>
  
  <!-- Pediment (triangular roof) -->
  <polygon points="300,300 500,300 400,180" fill="#A0826D" stroke="#8B7355" stroke-width="2"/>
  
  <!-- Entrance doorway -->
  <rect x="370" y="440" width="60" height="80" fill="#696969"/>
  <polygon points="370,440 430,440 400,410" fill="#8B7355"/>
  
  <!-- Steps -->
  <rect y="520" width="800" height="80" fill="#A0826D" opacity="0.3"/>
  
  <!-- Foreground plaza -->
  <rect y="520" width="800" height="30" fill="#C9B0A3"/>
  
  <!-- Sun -->
  <circle cx="100" cy="80" r="45" fill="#FFD700" opacity="0.7"/>
</svg>
