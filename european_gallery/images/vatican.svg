<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="holysky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#B0C4DE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E6E6FA;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Sky -->
  <rect width="800" height="600" fill="url(#holysky)"/>
  
  <!-- Dome base -->
  <ellipse cx="400" cy="280" rx="100" ry="40" fill="#B8B8B8"/>
  
  <!-- Main Dome -->
  <path d="M 300 280 Q 300 180 400 150 Q 500 180 500 280" fill="#C0A080" stroke="#8B7355" stroke-width="2"/>
  
  <!-- Dome segments -->
  <line x1="330" y1="260" x2="330" y2="160" stroke="#8B7355" stroke-width="2" opacity="0.6"/>
  <line x1="365" y1="235" x2="365" y2="140" stroke="#8B7355" stroke-width="2" opacity="0.6"/>
  <line x1="400" y1="225" x2="400" y2="125" stroke="#8B7355" stroke-width="2" opacity="0.6"/>
  <line x1="435" y1="235" x2="435" y2="140" stroke="#8B7355" stroke-width="2" opacity="0.6"/>
  <line x1="470" y1="260" x2="470" y2="160" stroke="#8B7355" stroke-width="2" opacity="0.6"/>
  
  <!-- Lantern -->
  <circle cx="400" cy="140" r="18" fill="#D4A574"/>
  <circle cx="400" cy="130" r="12" fill="#FFD700"/>
  
  <!-- Cross on top -->
  <line x1="400" y1="110" x2="400" y2="90" stroke="#FFD700" stroke-width="3"/>
  <line x1="385" y1="100" x2="415" y2="100" stroke="#FFD700" stroke-width="3"/>
  
  <!-- Basilica building -->
  <rect x="250" y="280" width="300" height="180" fill="#E8D8C8" stroke="#8B7355" stroke-width="2"/>
  
  <!-- Main entrance -->
  <rect x="350" y="420" width="100" height="40" fill="#8B7355"/>
  
  <!-- Columns -->
  <rect x="275" y="280" width="15" height="180" fill="#B8B8B8"/>
  <rect x="375" y="280" width="15" height="180" fill="#B8B8B8"/>
  <rect x="475" y="280" width="15" height="180" fill="#B8B8B8"/>
  
  <!-- Windows -->
  <circle cx="290" cy="320" r="12" fill="#87CEEB"/>
  <circle cx="340" cy="320" r="12" fill="#87CEEB"/>
  <circle cx="460" cy="320" r="12" fill="#87CEEB"/>
  <circle cx="510" cy="320" r="12" fill="#87CEEB"/>
  
  <circle cx="290" cy="380" r="12" fill="#87CEEB"/>
  <circle cx="340" cy="380" r="12" fill="#87CEEB"/>
  <circle cx="460" cy="380" r="12" fill="#87CEEB"/>
  <circle cx="510" cy="380" r="12" fill="#87CEEB"/>
  
  <!-- Courtyard -->
  <rect y="460" width="800" height="140" fill="#A0826D" opacity="0.2"/>
</svg>
