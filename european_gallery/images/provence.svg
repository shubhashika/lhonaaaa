<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="provSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFE4C4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Sky -->
  <rect width="800" height="600" fill="url(#provSky)"/>
  
  <!-- Lavender fields - horizontal stripes -->
  <rect y="300" width="800" height="30" fill="#9932CC" opacity="0.8"/>
  <rect y="335" width="800" height="30" fill="#8A2BE2" opacity="0.6"/>
  <rect y="370" width="800" height="30" fill="#9932CC" opacity="0.7"/>
  <rect y="405" width="800" height="30" fill="#8A2BE2" opacity="0.5"/>
  <rect y="440" width="800" height="30" fill="#9932CC" opacity="0.6"/>
  <rect y="475" width="800" height="30" fill="#8A2BE2" opacity="0.4"/>
  <rect y="510" width="800" height="90" fill="#6B4423"/>
  
  <!-- Stone farmhouse -->
  <rect x="200" y="240" width="150" height="120" fill="#D4A574"/>
  <rect x="210" y="255" width="30" height="35" fill="#87CEEB"/>
  <rect x="260" y="255" width="30" height="35" fill="#87CEEB"/>
  <rect x="310" y="255" width="30" height="35" fill="#87CEEB"/>
  <polygon points="275,240 225,180 325,180" fill="#8B4513"/>
  
  <!-- Stone wall -->
  <line x1="100" y1="260" x2="600" y2="260" stroke="#A0826D" stroke-width="4"/>
  
  <!-- Cypress trees -->
  <polygon points="80,300 60,350 100,350" fill="#2F4F4F"/>
  <polygon points="630,320 610,370 650,370" fill="#2F4F4F"/>
  <polygon points="700,310 680,360 720,360" fill="#2F4F4F"/>
  
  <!-- Sun -->
  <circle cx="700" cy="60" r="50" fill="#FFD700" opacity="0.8"/>
  
  <!-- Wind (suggested by line) -->
  <line x1="50" y1="150" x2="150" y2="150" stroke="#FFFFFF" stroke-width="2" opacity="0.3"/>
  <line x1="650" y1="200" x2="750" y2="200" stroke="#FFFFFF" stroke-width="2" opacity="0.3"/>
</svg>
