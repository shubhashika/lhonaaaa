<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="verSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#B0C4DE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E6E6FA;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Sky -->
  <rect width="800" height="600" fill="url(#verSky)"/>
  
  <!-- Palace building -->
  <rect x="100" y="200" width="600" height="250" fill="#F5DEB3"/>
  <rect x="100" y="200" width="600" height="30" fill="#D4A574"/>
  
  <!-- Palace details - columns -->
  <line x1="130" y1="200" x2="130" y2="450" stroke="#A0826D" stroke-width="3"/>
  <line x1="180" y1="200" x2="180" y2="450" stroke="#A0826D" stroke-width="3"/>
  <line x1="230" y1="200" x2="230" y2="450" stroke="#A0826D" stroke-width="3"/>
  <line x1="280" y1="200" x2="280" y2="450" stroke="#A0826D" stroke-width="3"/>
  <line x1="400" y1="200" x2="400" y2="450" stroke="#A0826D" stroke-width="3"/>
  <line x1="520" y1="200" x2="520" y2="450" stroke="#A0826D" stroke-width="3"/>
  <line x1="570" y1="200" x2="570" y2="450" stroke="#A0826D" stroke-width="3"/>
  <line x1="620" y1="200" x2="620" y2="450" stroke="#A0826D" stroke-width="3"/>
  <line x1="670" y1="200" x2="670" y2="450" stroke="#A0826D" stroke-width="3"/>
  
  <!-- Mansard roofs -->
  <polygon points="100,200 150,120 200,200" fill="#8B4513"/>
  <polygon points="200,200 300,100 400,200" fill="#A0522D"/>
  <polygon points="400,200 500,110 600,200" fill="#8B4513"/>
  <polygon points="600,200 650,120 700,200" fill="#A0522D"/>
  
  <!-- Windows -->
  <circle cx="140" cy="270" r="8" fill="#87CEEB"/>
  <circle cx="190" cy="270" r="8" fill="#87CEEB"/>
  <circle cx="240" cy="270" r="8" fill="#87CEEB"/>
  <circle cx="360" cy="270" r="8" fill="#87CEEB"/>
  <circle cx="440" cy="270" r="8" fill="#87CEEB"/>
  <circle cx="560" cy="270" r="8" fill="#87CEEB"/>
  <circle cx="660" cy="270" r="8" fill="#87CEEB"/>
  
  <circle cx="140" cy="350" r="8" fill="#87CEEB"/>
  <circle cx="240" cy="350" r="8" fill="#87CEEB"/>
  <circle cx="360" cy="350" r="8" fill="#87CEEB"/>
  <circle cx="440" cy="350" r="8" fill="#87CEEB"/>
  <circle cx="560" cy="350" r="8" fill="#87CEEB"/>
  <circle cx="660" cy="350" r="8" fill="#87CEEB"/>
  
  <!-- Palace fountains in front -->
  <circle cx="250" cy="480" r="25" fill="#87CEEB"/>
  <circle cx="250" cy="480" r="12" fill="#FFFFFF" opacity="0.6"/>
  
  <circle cx="550" cy="480" r="25" fill="#87CEEB"/>
  <circle cx="550" cy="480" r="12" fill="#FFFFFF" opacity="0.6"/>
  
  <!-- Gardens -->
  <ellipse cx="400" cy="520" rx="350" ry="70" fill="#2E8B57" opacity="0.4"/>
</svg>
