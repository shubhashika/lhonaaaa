<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="seaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1E90FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#006994;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="skyGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0F6FF;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Sky -->
  <rect width="800" height="350" fill="url(#skyGrad2)"/>
  
  <!-- Sea -->
  <rect y="350" width="800" height="250" fill="url(#seaGrad)"/>
  
  <!-- Cliffs -->
  <polygon points="0,350 150,250 250,280 350,240 450,270 550,230 650,260 750,250 800,300 800,600 0,600" fill="#8B7355"/>
  <polygon points="0,350 150,250 250,280 350,240 450,270 550,230 650,260 750,250 800,300 800,450 0,450" fill="#A0826D"/>
  
  <!-- Buildings on cliff -->
  <rect x="200" y="260" width="60" height="50" fill="#FFE4C4"/>
  <rect x="320" y="220" width="70" height="60" fill="#F5DEB3"/>
  <rect x="480" y="250" width="65" height="55" fill="#FFE4C4"/>
  <rect x="650" y="270" width="60" height="45" fill="#F5DEB3"/>
  
  <!-- Windows -->
  <circle cx="220" cy="280" r="6" fill="#87CEEB"/>
  <circle cx="245" cy="280" r="6" fill="#87CEEB"/>
  <circle cx="340" cy="245" r="6" fill="#87CEEB"/>
  <circle cx="370" cy="245" r="6" fill="#87CEEB"/>
  
  <!-- Vegetation on cliffs -->
  <ellipse cx="100" cy="300" rx="40" ry="30" fill="#2E8B57"/>
  <ellipse cx="400" cy="260" rx="35" ry="25" fill="#2E8B57"/>
  <ellipse cx="700" cy="290" rx="30" ry="20" fill="#2E8B57"/>
  
  <!-- Beach -->
  <ellipse cx="400" cy="480" rx="150" ry="40" fill="#F4A460"/>
  
  <!-- Boats -->
  <ellipse cx="250" cy="420" rx="30" ry="15" fill="#DC143C"/>
  <polygon points="250,420 255,405 245,405" fill="#FFD700"/>
  
  <ellipse cx="550" cy="450" rx="25" ry="12" fill="#1C1C1C"/>
  <polygon points="550,450 555,435 545,435" fill="#FFA500"/>
  
  <!-- Sun -->
  <circle cx="700" cy="80" r="45" fill="#FFD700"/>
</svg>
