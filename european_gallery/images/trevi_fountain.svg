<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="fountainSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#B0C4DE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E6E6FA;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Sky -->
  <rect width="800" height="600" fill="url(#fountainSky)"/>
  
  <!-- Main fountain basin -->
  <ellipse cx="400" cy="420" rx="180" ry="100" fill="#87CEEB" stroke="#A0826D" stroke-width="3"/>
  
  <!-- Water in basin -->
  <ellipse cx="400" cy="420" rx="170" ry="90" fill="#4A90E2" opacity="0.6"/>
  
  <!-- Fountain sculptures - central -->
  <circle cx="400" cy="300" r="30" fill="#C0A080"/>
  <path d="M 380 300 L 380 350 L 420 350 L 420 300" fill="#C0A080"/>
  
  <!-- Water jets -->
  <path d="M 370 350 Q 350 340 340 380" stroke="#87CEEB" stroke-width="4" fill="none" opacity="0.7"/>
  <path d="M 430 350 Q 450 340 460 380" stroke="#87CEEB" stroke-width="4" fill="none" opacity="0.7"/>
  <path d="M 400 330 L 400 360" stroke="#87CEEB" stroke-width="5" opacity="0.8"/>
  
  <!-- Side sculptures -->
  <circle cx="280" cy="320" r="25" fill="#B8B8B8"/>
  <circle cx="520" cy="320" r="25" fill="#B8B8B8"/>
  
  <!-- Architectural backdrop - palazzo -->
  <rect x="150" y="150" width="500" height="200" fill="#F5DEB3"/>
  <rect x="150" y="150" width="500" height="25" fill="#D4A574"/>
  
  <!-- Columns -->
  <rect x="180" y="150" width="20" height="200" fill="#A0826D"/>
  <rect x="280" y="150" width="20" height="200" fill="#A0826D"/>
  <rect x="500" y="150" width="20" height="200" fill="#A0826D"/>
  <rect x="600" y="150" width="20" height="200" fill="#A0826D"/>
  
  <!-- Windows -->
  <circle cx="240" cy="200" r="12" fill="#87CEEB"/>
  <circle cx="320" cy="200" r="12" fill="#87CEEB"/>
  <circle cx="480" cy="200" r="12" fill="#87CEEB"/>
  <circle cx="560" cy="200" r="12" fill="#87CEEB"/>
  
  <circle cx="240" cy="280" r="12" fill="#87CEEB"/>
  <circle cx="400" cy="280" r="12" fill="#87CEEB"/>
  <circle cx="560" cy="280" r="12" fill="#87CEEB"/>
  
  <!-- Coins in water (suggestion) -->
  <circle cx="350" cy="430" r="5" fill="#FFD700" opacity="0.7"/>
  <circle cx="380" cy="440" r="5" fill="#FFD700" opacity="0.7"/>
  <circle cx="420" cy="435" r="5" fill="#FFD700" opacity="0.7"/>
  <circle cx="450" cy="425" r="5" fill="#FFD700" opacity="0.7"/>
  
  <!-- Square/plaza -->
  <rect y="520" width="800" height="80" fill="#A0826D" opacity="0.2"/>
</svg>
