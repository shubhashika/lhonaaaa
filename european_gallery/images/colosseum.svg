<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="romanSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFE4C4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Sky -->
  <rect width="800" height="600" fill="url(#romanSky)"/>
  
  <!-- Colosseum outer ring -->
  <ellipse cx="400" cy="320" rx="150" ry="120" fill="#C9B0A3"/>
  <ellipse cx="400" cy="320" rx="145" ry="115" fill="#D4A574"/>
  
  <!-- Colosseum arches - outer level -->
  <ellipse cx="250" cy="320" rx="25" ry="35" fill="#8B7355"/>
  <ellipse cx="310" cy="280" rx="25" ry="40" fill="#8B7355"/>
  <ellipse cx="370" cy="250" rx="25" ry="42" fill="#8B7355"/>
  <ellipse cx="430" cy="250" rx="25" ry="42" fill="#8B7355"/>
  <ellipse cx="490" cy="280" rx="25" ry="40" fill="#8B7355"/>
  <ellipse cx="550" cy="320" rx="25" ry="35" fill="#8B7355"/>
  
  <!-- Second level arches -->
  <ellipse cx="270" cy="340" rx="20" ry="28" fill="#A0826D"/>
  <ellipse cx="330" cy="310" rx="20" ry="32" fill="#A0826D"/>
  <ellipse cx="400" cy="290" rx="20" ry="34" fill="#A0826D"/>
  <ellipse cx="470" cy="310" rx="20" ry="32" fill="#A0826D"/>
  <ellipse cx="530" cy="340" rx="20" ry="28" fill="#A0826D"/>
  
  <!-- Interior darkness - representing the inside -->
  <ellipse cx="400" cy="320" rx="80" ry="65" fill="#696969" opacity="0.5"/>
  
  <!-- Windows/openings -->
  <rect x="280" y="300" width="15" height="20" fill="#87CEEB"/>
  <rect x="360" y="280" width="15" height="25" fill="#87CEEB"/>
  <rect x="440" y="280" width="15" height="25" fill="#87CEEB"/>
  <rect x="520" y="300" width="15" height="20" fill="#87CEEB"/>
  
  <!-- Ground -->
  <rect y="500" width="800" height="100" fill="#A0826D" opacity="0.3"/>
  
  <!-- Rubble/broken parts -->
  <polygon points="150,420 170,450 130,450" fill="#8B7355"/>
  <polygon points="650,430 630,460 670,460" fill="#8B7355"/>
  
  <!-- Sun -->
  <circle cx="700" cy="80" r="40" fill="#FFD700" opacity="0.8"/>
  
  <!-- Clouds -->
  <ellipse cx="150" cy="120" rx="45" ry="22" fill="#FFFFFF" opacity="0.6"/>
</svg>
