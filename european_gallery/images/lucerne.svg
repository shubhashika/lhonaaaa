<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="lucerneSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0F6FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lucerneLake" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E5C8A;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Sky -->
  <rect width="800" height="350" fill="url(#lucerneSky)"/>
  
  <!-- Lake -->
  <rect y="350" width="800" height="250" fill="url(#lucerneLake)"/>
  
  <!-- Mountains behind -->
  <polygon points="0,350 120,200 250,350" fill="#6B4423"/>
  <polygon points="550,350 680,150 800,350" fill="#6B4423"/>
  
  <!-- Chapel Bridge with towers -->
  <rect x="200" y="410" width="400" height="40" fill="#8B7355" stroke="#696969" stroke-width="2"/>
  
  <!-- Water Gate Tower left -->
  <rect x="180" y="380" width="40" height="70" fill="#696969"/>
  <polygon points="190,380 200,340 210,380" fill="#8B4513"/>
  
  <!-- Water Gate Tower right -->
  <rect x="580" y="380" width="40" height="70" fill="#696969"/>
  <polygon points="590,380 600,340 610,380" fill="#8B4513"/>
  
  <!-- Octagonal tower in middle -->
  <polygon points="400,370 370,395 385,435 415,435 430,395" fill="#A0826D"/>
  <circle cx="400" cy="390" r="8" fill="#87CEEB" opacity="0.7"/>
  
  <!-- Old town buildings -->
  <rect x="100" y="300" width="80" height="80" fill="#D4A574"/>
  <rect x="280" y="310" width="75" height="75" fill="#E8CBA5"/>
  
  <!-- Building details -->
  <polygon points="120,300 100,280 140,300" fill="#8B4513"/>
  <polygon points="300,310 280,290 320,310" fill="#A0522D"/>
  
  <!-- Windows -->
  <circle cx="115" cy="330" r="6" fill="#87CEEB"/>
  <circle cx="135" cy="330" r="6" fill="#87CEEB"/>
  <circle cx="295" cy="340" r="6" fill="#87CEEB"/>
  <circle cx="315" cy="340" r="6" fill="#87CEEB"/>
  
  <!-- Waterfront -->
  <ellipse cx="250" cy="470" rx="120" ry="40" fill="#2E5C8A" opacity="0.3"/>
  
  <!-- Boats -->
  <ellipse cx="350" cy="480" rx="25" ry="13" fill="#DC143C"/>
  <ellipse cx="500" cy="490" rx="23" ry="12" fill="#1C1C1C"/>
</svg>
